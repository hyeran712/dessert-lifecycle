name: 주간 디저트 레이더 업데이트

on:
  schedule:
    - cron: '23 23 * * 0'   # 매주 월요일 08:23 (한국 시간)
  workflow_dispatch:         # Actions 탭에서 직접 실행 가능

permissions:
  contents: write

concurrency:
  group: weekly-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 패키지 설치
        run: pip install pandas==2.2.3 numpy==2.1.3 requests==2.32.3
      - name: 인허가 데이터 받아서 레이더 계산
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          API_ENDPOINTS: ${{ vars.API_ENDPOINTS }}
        run: python scripts/update.py
      - name: 바뀐 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live dessert_lifecycle/data/shops_filtered.csv
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "주간 레이더 자동 업데이트 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi
