<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd400">
<title>디저트 타이밍</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/brand/favicon.png?v=7">
<link rel="icon" type="image/png" sizes="512x512" href="img/brand/icon-512.png?v=7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="img/brand/apple-touch-icon.png?v=7">
<meta name="description" content="네이버 10년치 검색량으로 본 디저트 수명주기와 출시 타이밍">
<meta property="og:type" content="website">
<meta property="og:site_name" content="디저트 타이밍">
<meta property="og:title" content="디저트 타이밍">
<meta property="og:description" content="신메뉴, 언제 내고 언제 접을까? 네이버 10년치 검색량과 전국 매장 데이터로 보는 디저트 타이밍">
<meta property="og:url" content="https://hyeran712.github.io/dessert-lifecycle/">
<meta property="og:image" content="https://hyeran712.github.io/dessert-lifecycle/img/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hyeran712.github.io/dessert-lifecycle/img/brand/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f4f6f6; --surface:#ffffff; --ink:#2b3034; --ink-2:#565d63; --ink-3:#8a9197;
  --line:#e2e7e8; --grid:#eef1f2;
  --teal:#0e8a8c; --teal-d:#0a6b6d; --teal-l:#e3f2f2; --charcoal:#41474d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --t-hot:#0e8a8c; --t-fad:#8a9197; --t-stay:#2a78d6; --t-season:#c27a00; --t-watch:#6c63c7;
  --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--teal-d)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(244,246,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:24px;height:60px}
.logo{font-weight:900;font-size:18px;color:var(--charcoal);text-decoration:none;letter-spacing:-.3px}
.logo b{color:var(--teal)}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-top:-4px}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav a,nav button{font:inherit;font-size:14px;font-weight:500;color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:999px;border:0;background:none;cursor:pointer}
nav a:hover,nav button:hover{background:var(--teal-l);color:var(--teal-d)}
nav .about{border:1px solid var(--charcoal);color:var(--charcoal);font-weight:700;font-size:12px;letter-spacing:.5px}
.hero{padding-top:64px;padding-bottom:36px}
.eyebrow{font-size:13px;font-weight:700;color:var(--teal);letter-spacing:1.5px;text-transform:uppercase}
h1{font-size:clamp(30px,5vw,48px);line-height:1.2;margin:10px 0 14px;font-weight:900;letter-spacing:-1px;color:var(--charcoal)}
h1 em{font-style:normal;color:var(--teal)}
.lead{font-size:17px;color:var(--ink-2);max-width:640px;margin:0}
section{padding:28px 0 48px}
h2{font-size:26px;font-weight:900;letter-spacing:-.5px;margin:0 0 6px;color:var(--charcoal)}
h2 .num{color:var(--teal);margin-right:6px}
.sub{color:var(--ink-2);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-group{margin-bottom:14px}
.chip-group > span{display:block;font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.chip{font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--teal);color:var(--teal-d)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.chip .hot{display:inline-block;font-size:10px;font-weight:900;background:#eb6834;color:#fff;border-radius:6px;padding:0 5px;margin-left:5px;vertical-align:2px}
.chip[aria-pressed="true"] .hot{background:#fff;color:#eb6834}
.chip.live{border-style:dashed}
.chip .lv{display:inline-block;font-size:10px;font-weight:800;background:#ffd400;color:#1c1c1c;border-radius:6px;padding:0 5px;margin-left:5px;vertical-align:2px}
.chip.loading{opacity:.6;cursor:progress}
.chip.loading .lv::after{content:"…"}
.result{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:20px}
.verdict .badge{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:2px 10px}
.verdict h3{font-size:22px;line-height:1.35;margin:12px 0 10px;letter-spacing:-.4px}
.verdict p{margin:0;color:var(--ink-2);font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--ink-3)}
.stat b{font-size:20px;font-weight:900;color:var(--charcoal)}
.stat b small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:2px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chart-head h4{margin:0;font-size:15px}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:13px;border:0;background:none;padding:4px 12px;border-radius:999px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--teal-d);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chart-box{position:relative;height:300px}
.chart-box.tall{height:340px}
.note{font-size:12px;color:var(--ink-3);margin:8px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.finding{margin-bottom:20px}
.finding h3{font-size:19px;margin:0 0 4px;letter-spacing:-.3px}
.finding > p{margin:0 0 16px;color:var(--ink-2)}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.kpi{flex:1 1 200px;border-left:3px solid var(--teal);padding:4px 0 4px 12px}
.kpi b{display:block;font-size:26px;font-weight:900;color:var(--charcoal);line-height:1.2}
.kpi span{font-size:13px;color:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:0 0 8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--ink-3);font-weight:700}
td:first-child{font-weight:700;white-space:nowrap}
.tag{display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;color:#fff}
.case-list{margin:14px 0 0;padding-left:18px;color:var(--ink-2)}
.case-list li{margin-bottom:6px}
.case-list b{color:var(--ink)}
.shopbox{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.shop-k{margin:0;font-size:12px;font-weight:700;color:var(--ink-3)}
.shop-k small{font-weight:500}
.shop-v{margin:2px 0 0;font-size:18px;font-weight:900;color:var(--charcoal)}
.shop-s{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
table.small{font-size:13.5px;min-width:520px}
table.small td,table.small th{padding:9px 10px}
table.small td:first-child{white-space:nowrap}
.num-r{text-align:right}
.mini h4{margin:0 0 6px;font-size:14px}
.mini .chart-box{height:200px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--bg);border-radius:10px;padding:10px 12px}
.tile > span{display:block;font-size:12.5px;color:var(--ink-2)}
.tile b{font-size:20px;font-weight:900;color:var(--charcoal)}
.tile small{display:block;font-size:12px;color:var(--ink-3)}
.tile .up{color:var(--teal-d);font-weight:700}.tile .dn{color:#b4532a;font-weight:700}
.rd-item{padding:10px 0;border-bottom:1px solid var(--line)}
.rd-item:last-child{border-bottom:0}
.rd-item .w{font-weight:900;font-size:16px;color:var(--charcoal)}
.rd-item .m{font-size:12.5px;color:var(--ink-2);margin-left:6px}
.rd-item .ex{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.kb{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;vertical-align:2px;margin-left:4px;color:#fff}
.kb.km{background:var(--teal)}.kb.kbr{background:var(--s1)}
.grid2 > *{min-width:0}
.rd-group{font-size:12px;font-weight:700;color:var(--ink-3);margin:10px 0 0}
footer{border-top:1px solid var(--line);padding:28px 0 48px;font-size:13px;color:var(--ink-3)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
dialog{border:0;border-radius:var(--radius);padding:0;max-width:640px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(30,35,38,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0;font-size:18px}
.dlg-head button{font-size:22px;border:0;background:none;cursor:pointer;color:var(--ink-2);line-height:1}
.dlg-body{padding:6px 22px 22px;max-height:70vh;overflow:auto;font-size:14.5px;color:var(--ink-2)}
.dlg-body h4{color:var(--ink);font-size:15px;margin:18px 0 4px}
.dlg-body p,.dlg-body ul{margin:0}
@media (max-width:860px){
  .result,.grid2{grid-template-columns:1fr}
  nav a.hide-sm{display:none}
}
.mnav{display:none}
.hint-sm{display:none;color:var(--ink-3);font-size:13px}
@media (max-width:520px){
  nav a{display:none}
  .mnav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 10px;border-top:1px solid var(--line);scrollbar-width:none}
  .mnav::-webkit-scrollbar{display:none}
  .mnav a{flex:0 0 auto;font-size:13.5px;font-weight:700;color:var(--ink-2);text-decoration:none;padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
  .mnav a:active{background:var(--teal-l);color:var(--teal-d)}
  .wrap{padding:0 16px}
  .hero{padding-top:28px;padding-bottom:12px}
  h1{font-size:30px;margin:6px 0 10px}
  .lead{font-size:15px}
  section{padding:16px 0 28px;scroll-margin-top:110px}
  h2{font-size:21px}
  .sub{margin-bottom:14px;font-size:14.5px}
  .chip-group{margin-bottom:10px}
  .chip-group .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
  .chip-group .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:13.5px;padding:6px 12px}
  .hint-sm{display:inline}
  .result{margin-top:14px;gap:14px}
  .verdict h3{font-size:19px}
  .stat b{font-size:18px}
  .kpi b{font-size:21px}
  .finding h3{font-size:17px}
  .card{padding:18px}
  .chart-box{height:260px}
  header .wrap{gap:10px}
  .logo small{display:none}
}

.qform{display:flex;gap:8px;margin-bottom:6px}
.qform input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff}
.qform input:focus{outline:3px solid var(--pop-y,#ffd400);outline-offset:1px}
/* 검색은 보조 버튼(흰 바탕) — 주황·검정 강조는 '다음 · 타이밍 진단'에만 (2026-11-09 사용자가 헷갈림) */
.qform button{font:inherit;font-weight:800;font-size:15px;padding:0 16px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.qform button:hover{background:#fff8dc}
.qform button:active{transform:translate(1px,1px)}
#q-msg{margin:4px 0 14px;min-height:1em}
/* 유행 수명 막대 */
.life{display:grid;gap:14px;margin-top:6px}
.life-row{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center}
.life-name{font-weight:900;font-size:14px;line-height:1.3}
.life-name small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.life-track{display:flex;height:38px;align-items:stretch;min-width:0}
.seg-up,.seg-dn{display:flex;align-items:center;padding:0 8px;font-weight:900;font-size:13px;white-space:nowrap;border:2px solid var(--ink);min-width:58px}
.seg-up{background:var(--teal);color:#fff;border-radius:10px 0 0 10px}
.seg-dn{background:#fff;color:var(--ink);border-left:0;border-radius:0 10px 10px 0}
.seg-na{background:repeating-linear-gradient(45deg,#fff,#fff 6px,#f1ead2 6px,#f1ead2 12px)}
.life-row.me .life-name{color:var(--teal-d)}
.life-row.me .life-track{filter:drop-shadow(3px 3px 0 var(--ink))}
/* 순위 막대 */
.rank{display:grid;gap:5px;margin-top:10px}
.rk{display:grid;grid-template-columns:28px 120px 1fr 64px;gap:8px;align-items:center;font-size:13.5px}
.rk .no{font-weight:900;color:var(--ink-3);text-align:right}
.rk .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .bar{height:18px;border-radius:0 6px 6px 0;border:2px solid var(--ink);min-width:4px}
.rk .pc{font-weight:900;text-align:right}
.rk.me{background:var(--pop-y);border-radius:8px;outline:2px solid var(--ink)}
/* 디저트 달력 */
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.mo{border:2px solid var(--ink);border-radius:12px;padding:10px 8px;text-align:center;position:relative;min-height:74px}
.mo b{display:block;font-size:15px}
.mo span{font-size:12.5px;font-weight:700}
.mo .stk{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-4deg);background:var(--ink);color:var(--pop-y);font-size:11px;font-weight:900;padding:1px 7px;border-radius:6px;white-space:nowrap}
.mo .stk.go{background:var(--teal);color:#fff}
@media (max-width:520px){
  .life-row{grid-template-columns:1fr;gap:4px}
  .rk{grid-template-columns:22px 92px 1fr 44px;font-size:12.5px}
  .cal{grid-template-columns:repeat(4,1fr)}
}
#shop-table tr.me td{background:var(--pop-y);font-weight:900}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pl{border:2px solid var(--ink);border-radius:14px;padding:14px;background:var(--bg)}
.pl .k{display:inline-block;font-size:12px;font-weight:900;background:var(--ink);color:var(--pop-y);border-radius:6px;padding:1px 8px}
.pl b{display:block;font-size:16px;margin:8px 0 4px;line-height:1.35}
.pl p{margin:0;font-size:13.5px;color:var(--ink-2)}
#p-table tr.me td{background:var(--pop-y);font-weight:900}
@media (max-width:860px){.plan{grid-template-columns:1fr}}
.warnbox{margin-top:14px;border:2px dashed var(--ink);border-radius:10px;padding:10px 12px;background:#fff}
.warnbox b{font-size:13px}
.warnbox ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.profile{margin-bottom:16px;padding:0}
.profile summary{cursor:pointer;padding:16px 20px;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.profile summary::-webkit-details-marker{display:none}
.profile summary::after{content:"＋";margin-left:auto;font-weight:900}
.profile[open] summary::after{content:"－"}
.profile summary span{font-size:13px;color:var(--ink-2)}
.auth-btn{margin-left:10px;display:flex;align-items:center;gap:6px;font:inherit;font-weight:900;font-size:14px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);padding:5px 12px;cursor:pointer;white-space:nowrap;max-width:150px}
.auth-btn span{overflow:hidden;text-overflow:ellipsis}
.auth-btn img{width:22px;height:22px;border-radius:50%;object-fit:cover}
@media (max-width:640px){.auth-btn{margin-left:auto;font-size:13px;padding:4px 10px}}
dialog.acct{max-width:420px;width:calc(100% - 32px)}
/* 로그인 창: 카카오(#FEE500·검은 말풍선)·구글(흰 배경·G 로고) 공식 버튼 규칙, 두 버튼 높이·간격 같게, 아이콘 왼쪽 끝 고정·글자 가운데 */
dialog.acct .dlg-head{background:#fff8dc}
.dlg-body .acct-lead{margin:2px 0 8px;font-size:16px;font-weight:900;color:var(--ink)}
.dlg-body .acct-list{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink);font-size:13.5px;white-space:nowrap}
.acct-list li::before{content:"✓";color:#14804a;font-weight:900;margin-right:4px}
.dlg-body .acct-sub{margin:0 0 18px;font-size:13.5px}
.sso{position:relative;display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:100%;height:48px;padding:0 44px;margin:0;border-radius:12px;font:inherit;font-weight:700;font-size:15px;line-height:1;cursor:pointer}
.sso+.sso{margin-top:10px}
.sso svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px}
.sso.kakao{background:#FEE500;color:rgba(0,0,0,.85);border:0}
.sso.google{background:#fff;color:#1f1f1f;border:1px solid #747775}
.sso:disabled{opacity:.6;cursor:wait}
#acct-msg{margin:10px 0 0;text-align:center}
.acct-later{text-align:center;margin:18px 0 0}
.dlg-body .acct-later p{margin:0 0 8px;font-size:13px}
.acct-later button{font:inherit;font-weight:700;font-size:14px;padding:8px 20px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
.acct-later button:hover{background:var(--pop-y)}
.dlg-body .acct-fine{text-align:center;font-size:11.5px;line-height:1.5;color:var(--ink-3);margin:18px 0 0}
.me-row{display:flex;gap:12px;align-items:center;margin-bottom:8px}.me-row img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.me-row b{display:block;font-size:17px}.me-row small{color:var(--ink-2)}
.acct-act{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.mk-fb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:14px;color:var(--ink-2)}
.mk-fb button{font:inherit;font-size:14px;font-weight:800;border:2px solid var(--ink);border-radius:999px;background:#fff;padding:5px 12px;cursor:pointer}
.mk-fb button:hover{background:#fff8dc}
/* 휴대폰: 저장·다른 메뉴 버튼은 한 줄에 나란히, 👍👎도 한 줄에 나란히 (질문 글은 위 줄) */
@media (max-width:640px){
  .mk-act{flex-wrap:nowrap;gap:8px}
  .mk-act .btn{flex:1 1 0;min-width:0;padding:11px 8px;font-size:14px;white-space:nowrap}
  .mk-long{display:none}
  .mk-fb>span:first-child{flex-basis:100%}

/* ===== 편의점 신상 POP 테마 ===== */
:root{
  --bg:#fff8dc; --surface:#ffffff; --ink:#1c1c1c; --ink-2:#3b3b3b; --ink-3:#6e6a5e;
  --line:#e9dfbf; --grid:#f1ead2;
  --teal:#ff5a1f; --teal-d:#d9430c; --teal-l:#ffe6d6; --charcoal:#1c1c1c;
  --pop-y:#ffd400; --pop-b:#2f6bff; --chart-main:#1c1c1c;
  --t-hot:#ff5a1f; --t-fad:#7b766a; --t-stay:#2f6bff; --t-season:#c27a00; --t-watch:#6c63c7;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
}

.mapstage{position:relative;margin-top:18px;border-radius:20px;overflow:hidden;padding:22px 22px 0;min-height:640px;
  background:#fff;
  border:1px solid rgba(28,28,28,.1)}   /* 지도 뒤 배경: 투명한 파란색 한 가지 톤 (2026-11-06) */
.mapstage > *{position:relative}
.ms-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ms-eye{font-size:11px;letter-spacing:2px;color:rgba(28,28,28,.5);margin:0 0 4px;font-weight:700}

.ms-chips span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);color:#3b4440;box-shadow:0 2px 10px rgba(0,0,0,.05)}

.map-wrap{position:relative;max-width:580px;padding-right:60px;box-sizing:border-box;margin:4px auto 0 calc(50% - 325px);transition:margin-left .35s ease;overflow:hidden;touch-action:none}
#kmap{width:100%;height:auto;display:block;overflow:visible}
#kmap path.top{fill-opacity:1;stroke:none;cursor:pointer;transition:fill-opacity .2s}
#kmap path.top:hover{filter:brightness(1.04)}
#kmap .groove{pointer-events:none;fill:none;stroke-linejoin:round}
#kmap .gloss{pointer-events:none}
#kmap .coast{fill:none;stroke:#e3a565;stroke-width:2.4;stroke-linejoin:round;pointer-events:none}   /* 지도 바깥 테두리: 칸 아래에 그려서 바깥쪽 반만 보임 */
#kmap .groove use:nth-child(1){stroke-opacity:1;stroke-width:5}#kmap .groove use:nth-child(2){stroke-opacity:.55;stroke-width:1.3}#kmap .groove use:nth-child(3){stroke-opacity:0}
#kmap .tops path.sel{fill-opacity:.25}

#kmap .sel-pin{animation:rise .45s cubic-bezier(.2,.9,.3,1.15)}
#kmap .sel-pin line{stroke:#ff5a1f;stroke-width:1.4}#kmap .sel-pin circle{fill:#fff;stroke:#ff5a1f;stroke-width:1.8}

@keyframes rise{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
#kmap text{pointer-events:none;text-anchor:middle;font-family:"Noto Sans KR";paint-order:stroke;stroke:rgba(255,248,232,.7);stroke-width:2.2px}
#kmap .nm{font-size:12.5px;font-weight:900;fill:#3a2416}
#kmap .ct{font-size:8.5px;font-weight:500;fill:#7a5a40}
#kmap .lbls{pointer-events:none}
#kmap .pin line{stroke:#d94a12;stroke-width:1.3}
#kmap .pin circle{fill:#fff;stroke:#d94a12;stroke-width:1.5}
